title: Contoso Retail Baseline
notes: Gold-layer retail KPIs produced by the local dbt project.
source: db

queries:
  monthly:
    sql: |
      select
        order_month,
        channel,
        revenue,
        gross_margin,
        gross_margin_rate,
        units
      from contoso.gold.monthly_sales
      order by order_month, channel

  totals:
    sql: |
      select
        round(sum(revenue), 2) as revenue,
        round(sum(gross_margin), 2) as gross_margin,
        sum(units) as units
      from contoso.gold.monthly_sales

charts:
  revenue_kpi:
    label: Revenue
    query: queries.totals
    type: kpi
    value: revenue

  margin_kpi:
    label: Gross margin
    query: queries.totals
    type: kpi
    value: gross_margin

  units_kpi:
    label: Units sold
    query: queries.totals
    type: kpi
    value: units

  revenue_trend:
    title: Monthly revenue by channel
    query: queries.monthly
    type: line
    x: order_month
    y: revenue
    color: channel

rows:
  - cols:
      - revenue_kpi
      - margin_kpi
      - units_kpi
  - revenue_trend
