name: QA Browser Smoke

on:
  pull_request:
    branches: [main]

env:
  # MosaicStudio commit the export is verified against (main, version 0.9.0; a commit, not a tag).
  # Keep in sync with PINNED_MOSAIC_SHA in tools/validate_with_mosaic.mjs and tools/open_in_mosaic.mjs.
  MOSAIC_SHA: 6f45dd06e95ee66d693fc08fb4369c2a6379e84c

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTOSO_WORKSPACE: ${{ github.workspace }}/workspace
      CONTOSO_DUCKLAKE_CATALOG: ${{ github.workspace }}/workspace/contoso.ducklake.sqlite
      CONTOSO_DUCKLAKE_DATA_PATH: ${{ github.workspace }}/workspace/contoso.ducklake.files
      CONTOSO_PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install API and web dependencies
        run: |
          pip install -e "apps/api[dev,dbt]"
          npm --prefix apps/web install
          npm --prefix apps/web install --no-save playwright@1.56.1
          npx --prefix apps/web playwright install --with-deps chromium

      - name: Start API and web
        run: |
          uvicorn app.main:app --app-dir apps/api --host 127.0.0.1 --port 8000 > /tmp/contoso-api.log 2>&1 &
          npm --prefix apps/web run dev -- --host 127.0.0.1 > /tmp/contoso-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/contoso-api.log || true
          cat /tmp/contoso-web.log || true
          exit 1

      - name: Run browser release smoke
        working-directory: apps/web
        run: node qa/browser-smoke.mjs

      - name: Verify project portfolio and switching
        working-directory: apps/web
        run: node qa/portfolio-smoke.mjs

      - name: Verify project workbenches and recovery
        working-directory: apps/web
        run: node qa/project-workbenches.mjs

      - name: Verify Fabric-style app writeback to Gold
        working-directory: apps/web
        run: node qa/fabric-app-smoke.mjs

      - name: Verify Architecture concept file and fallback
        working-directory: apps/web
        run: node qa/concept-smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contoso-v1-browser-smoke
          path: apps/web/qa-artifacts
          if-no-files-found: warn

      - name: Real retail journey (workspaces, restart reopen, fault/repair, export, a11y)
        run: python tools/qa_retail_journey.py --out qa-evidence/retail-journey

      - name: Validate journey export with MosaicStudio's own validators
        run: |
          git init --quiet /tmp/mosaic
          git -C /tmp/mosaic fetch --quiet --depth 1 https://github.com/julian-passebecq/datapass-mosaicstudio.git "$MOSAIC_SHA"
          test "$(git -C /tmp/mosaic rev-parse FETCH_HEAD)" = "$MOSAIC_SHA"
          node tools/validate_with_mosaic.mjs --mosaic /tmp/mosaic --ref "$MOSAIC_SHA" \
            --export qa-evidence/retail-journey/export --concept qa-evidence/retail-journey/contoso-sales-forecasting.concept.json

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-journey-evidence
          path: |
            qa-evidence/retail-journey/evidence.json
            qa-evidence/retail-journey/screenshots/
            qa-evidence/retail-journey/export/
            qa-evidence/retail-journey/*.concept.json
            qa-evidence/retail-journey/*.log
          if-no-files-found: warn

  open-in-mosaic:
    # The journey export opened in MosaicStudio's own UI (client:dev + standalone concept viewer) at MOSAIC_SHA.
    needs: browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download journey export
        uses: actions/download-artifact@v4
        with:
          name: retail-journey-evidence
          path: qa-evidence/retail-journey

      - name: Fetch MosaicStudio at the pinned commit
        run: |
          git init --quiet /tmp/mosaic
          git -C /tmp/mosaic fetch --quiet --depth 1 https://github.com/julian-passebecq/datapass-mosaicstudio.git "$MOSAIC_SHA"
          test "$(git -C /tmp/mosaic rev-parse FETCH_HEAD)" = "$MOSAIC_SHA"

      - name: Open the export and concept in MosaicStudio
        run: |
          node tools/open_in_mosaic.mjs --mosaic /tmp/mosaic --ref "$MOSAIC_SHA" --with-deps \
            --export qa-evidence/retail-journey/export \
            --concept qa-evidence/retail-journey/contoso-sales-forecasting.concept.json \
            --out qa-evidence/open-in-mosaic --port 21250

      - name: Upload open-in-Mosaic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-in-mosaic-evidence
          path: |
            qa-evidence/open-in-mosaic/evidence.json
            qa-evidence/open-in-mosaic/screenshots/
            qa-evidence/open-in-mosaic/*.log
          if-no-files-found: warn
