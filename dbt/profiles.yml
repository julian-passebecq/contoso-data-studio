contoso_data_studio:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ":memory:"
      threads: 4
      extensions: [ducklake]
      attach:
        - path: "ducklake:{{ env_var('CONTOSO_DUCKLAKE_CATALOG', '../workspace/contoso.ducklake') }}"
          alias: contoso
          options:
            data_path: "{{ env_var('CONTOSO_DUCKLAKE_DATA_PATH', '../workspace/contoso.ducklake.files') }}"
