contoso_data_studio:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ":memory:"
      threads: 1
      extensions: [ducklake, sqlite]
      attach:
        - path: "ducklake:sqlite:{{ env_var('CONTOSO_DUCKLAKE_CATALOG', '../workspace/contoso.ducklake.sqlite') }}"
          alias: contoso
          options:
            data_path: "{{ env_var('CONTOSO_DUCKLAKE_DATA_PATH', '../workspace/contoso.ducklake.files') }}"
